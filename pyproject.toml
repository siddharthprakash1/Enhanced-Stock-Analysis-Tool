[project]
name = "stock-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7", "pydantic-settings>=2.3", "pandas>=2.2", "numpy>=1.26",
  "yfinance>=0.2.40", "matplotlib>=3.8", "plotly>=5.22",
  "langgraph>=0.2.0", "langchain-anthropic>=0.3.0", "langchain-google-genai>=2.0.0", "langchain-core>=0.3.0",
  "jinja2>=3.1", "weasyprint>=62", "typer>=0.12", "vaderSentiment>=3.3.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.14", "ruff>=0.5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
stock-analyzer = "stock_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
